<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudMind Instagram Desktop</title>
<style>
    :root {
        --insta-bg: #ffffff;
        --border: #dbdbdb;
        --text: #262626;
        --secondary-text: #8e8e8e;
    }

    body {
        margin: 0;
        background-color: #fafafa;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* CONTAINER PARA COMPUTADOR */
    .desktop-wrapper {
        max-width: 935px;
        margin: 0 auto;
        padding: 30px 20px;
        background-color: #fafafa;
    }

    /* HEADER */
    header {
        display: flex;
        align-items: center;
        margin-bottom: 44px;
        padding: 0 20px;
    }

    .profile-pic-box {
        flex-basis: 30%;
        display: flex;
        justify-content: center;
    }

    .avatar-ring {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }

    .avatar-ring img {
        width: 95%;
        height: 95%;
        border-radius: 50%;
        border: 4px solid #fff;
        object-fit: cover;
    }

    .profile-info {
        flex-basis: 70%;
        padding-left: 60px;
    }

    .user-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .username { font-size: 28px; font-weight: 300; }

    .btn-edit {
        background-color: #efefef;
        border: 1px solid #dbdbdb;
        padding: 5px 15px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
    }

    .stats-row {
        display: flex;
        gap: 40px;
        margin-bottom: 20px;
        list-style: none;
        padding: 0;
    }

    .stats-row span { font-weight: 600; }

    .bio-box { font-size: 16px; line-height: 1.5; }
    .bio-box span { color: var(--secondary-text); }

    /* DESTAQUES (STORY HIGHLIGHTS) */
    .highlights-container {
        display: flex;
        gap: 45px;
        margin: 40px 0;
        padding: 0 40px;
    }

    .h-item { text-align: center; font-size: 12px; font-weight: 600; }
    .h-circle {
        width: 77px;
        height: 77px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: #fff;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }

    /* GRID DE POSTS - CORRIGIDO PARA BORDAS */
    .posts-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 28px; /* Espaçamento entre posts */
        border-top: 1px solid var(--border);
        padding-top: 40px;
    }

    .grid-card {
        position: relative;
        aspect-ratio: 1 / 1;
        background-color: #efefef;
        cursor: pointer;
        overflow: hidden;
    }

    .grid-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block; /* Remove espaços vazios na base da imagem */
    }

    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
        font-weight: bold;
        opacity: 0;
        transition: 0.2s;
    }

    .grid-card:hover .overlay { opacity: 1; }

    /* MODAL */
    #postModal {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal-box {
        background: #fff;
        max-width: 900px;
        width: 90%;
        height: 80vh;
        display: flex;
        position: relative;
    }

    .modal-img-side {
        flex: 1.2;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-img-side img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .modal-info-side { flex: 0.8; padding: 20px; display: flex; flex-direction: column; }

    .close-x {
        position: absolute;
        top: -40px; right: -40px;
        color: #fff; font-size: 30px; cursor: pointer;
    }
</style>
</head>
<body>

<div class="desktop-wrapper">
    <!-- HEADER -->
    <header>
        <div class="profile-pic-box">
            <div class="avatar-ring">
                <img src="logo.jpg" alt="CloudMind">
            </div>
        </div>
        <div class="profile-info">
            <div class="user-row">
                <h2 class="username">cloudmind_ai</h2>
                <button class="btn-edit">Editar Perfil</button>
                <button class="btn-edit">Ver arquivo</button>
                <span style="font-size: 24px; cursor:pointer;">⚙️</span>
            </div>
            <ul class="stats-row">
                <li><span>9</span> publicações</li>
                <li><span>1.2M</span> seguidores</li>
                <li><span>42</span> a seguir</li>
            </ul>
            <div class="bio-box">
                <strong>CloudMind | AI Engineering</strong>
                <span>Figura pública</span>
                <p>Armazenamento inteligente para mentes brilhantes. 🧠<br>
                Especialistas em Cloud & IA Generativa. 🚀</p>
                <a href="#" style="color:#00376b; text-decoration:none; font-weight:600;">cloudmind.ai/info</a>
            </div>
        </div>
    </header>

    <!-- DESTAQUES -->
    <div class="highlights-container">
        <div class="h-item"><div class="h-circle">⚡</div>Cloud</div>
        <div class="h-item"><div class="h-circle">🧠</div>AI</div>
        <div class="h-item"><div class="h-circle">🔐</div>Security</div>
        <div class="h-item"><div class="h-circle">🚀</div>2222</div>
        <div class="h-item"><div class="h-circle" style="color:#8e8e8e; font-size:40px;">+</div>Novo</div>
    </div>

    <!-- GRID DE POSTS -->
    <div class="posts-grid" id="mainGrid"></div>
</div>

<!-- MODAL -->
<div id="postModal">
    <div class="modal-box">
        <span class="close-x" id="closeX">&times;</span>
        <div class="modal-img-side">
            <img id="mImg" src="">
        </div>
        <div class="modal-info-side">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
                <div style="width:32px; height:32px; border-radius:50%; background: linear-gradient(45deg, #7c3aed, #06b6d4);"></div>
                <strong>cloudmind_ai</strong>
            </div>
            <p id="mTxt" style="font-size:14px; line-height:1.4;"></p>
        </div>
    </div>
</div>

<script>
    const cloudContent = [
        { url: "Gemini_Generated_Image_5olgvp5olgvp5olg.png", txt: "A gerir dados à escala global. 🌐" },
        { url: "Zlatan.png", txt: "Confie em nós como Zlatan.🐯" },
        { url: "Info.png", txt: "" },
        { url: "flayer.png", txt: "Segurança total nos teus arquivos. 🔐" },
        { url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800", txt: "O coração da nossa IA. 🔋" },
        { url: "https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800", txt: "Dados em movimento. 📉" },
        { url: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=800", txt: "Nós descentralizados. 💎" },
        { url: "A brain and a book AI-generated content may be incorrect_.jpg", txt: "Estuda IA. 🚀" },
        { url: "https://images.unsplash.com/photo-1677442136019-21780ecad995?w=800", txt: "A cloud que pensa por ti. 🤖" }
    ];

    const mainGrid = document.getElementById('mainGrid');
    const modal = document.getElementById('postModal');

    cloudContent.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'grid-card';
        card.innerHTML = `<img src="${p.url}"><div class="overlay">❤️ 15k &nbsp; 💬 200</div>`;
        card.onclick = () => {
            document.getElementById('mImg').src = p.url;
            document.getElementById('mTxt').innerText = p.txt;
            modal.style.display = 'flex';
        };
        mainGrid.appendChild(card);
    });

    document.getElementById('closeX').onclick = () => modal.style.display = 'none';
    window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; }
</script>

</body>
</html>
