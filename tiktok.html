<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloudMind (@cloudmind_ai) | TikTok</title>
<style>
    :root {
        --tt-black: #121212;
        --tt-pink: #fe2c55;
        --tt-cyan: #25f4ee;
        --tt-gray: #2f2f2f;
        --text-white: #ffffff;
    }

    body {
        margin: 0;
        background-color: var(--tt-black);
        color: var(--text-white);
        font-family: 'TikTokFont', 'ProximaNova', sans-serif;
    }

    /* CONTAINER PRINCIPAL */
    .tt-wrapper {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    /* HEADER DO PERFIL */
    .tt-header {
        display: flex;
        align-items: flex-start;
        margin-bottom: 30px;
    }

    .tt-avatar {
        width: 116px;
        height: 116px;
        border-radius: 50%;
        overflow: hidden;
        margin-right: 24px;
        border: 2px solid var(--tt-gray);
    }

    .tt-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .tt-title-section h2 { font-size: 32px; margin: 0; letter-spacing: -0.5px; }
    .tt-title-section h1 { font-size: 18px; margin: 4px 0 12px; font-weight: 400; }

    .tt-stats { display: flex; gap: 20px; margin-bottom: 15px; }
    .tt-stats span { font-size: 18px; font-weight: bold; }
    .tt-stats label { font-size: 16px; font-weight: 400; color: rgba(255,255,255,0.7); margin-left: 4px; }

    .tt-bio { font-size: 16px; line-height: 1.5; max-width: 450px; }
    .tt-bio a { color: var(--text-white); text-decoration: none; font-weight: bold; }

    /* BOTÕES */
    .tt-btn-follow {
        background-color: var(--tt-pink);
        color: white;
        border: none;
        padding: 10px 40px;
        font-size: 18px;
        font-weight: 700;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 15px;
        transition: 0.2s;
    }
    .tt-btn-follow:hover { background-color: #e0244a; }

    /* GRID DE VÍDEOS (3:4 Ratio) */
    .tt-video-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 16px;
        border-top: 1px solid rgba(255,255,255,0.1);
        padding-top: 20px;
    }

    .video-card {
        position: relative;
        aspect-ratio: 3 / 4;
        background-color: var(--tt-gray);
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
    }

    .video-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.4s;
    }

    .video-card:hover img { transform: scale(1.05); filter: brightness(0.8); }

    .video-footer {
        position: absolute;
        bottom: 10px;
        left: 10px;
        display: flex;
        align-items: center;
        gap: 5px;
        font-weight: bold;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    /* ESTILO "PLAY" OVERLAY */
    .play-icon {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 12px;
        background: rgba(0,0,0,0.4);
        padding: 2px 6px;
        border-radius: 2px;
    }

</style>
</head>
<body>

<div class="tt-wrapper">
    <!-- CABEÇALHO TIKTOK -->
    <header class="tt-header">
        <div class="tt-avatar">
            <img src="logo.jpg" alt="CloudMind Logo">
        </div>
        <div class="tt-title-section">
            <h2>cloudmind_ai</h2>
            <h1>CloudMind | AI Engineering</h1>
            
            <div class="tt-stats">
                <div><span>42</span><label>Following</label></div>
                <div><span>1.2M</span><label>Followers</label></div>
                <div><span>25.6M</span><label>Likes</label></div>
            </div>

            <div class="tt-bio">
                A cloud que pensa por ti. 🧠 <br>
                Novidades sobre IA e o futuro do armazenamento. <br>
                <a href="#">🔗 cloudmind.ai/join</a>
            </div>

            <button class="tt-btn-follow">Follow</button>
        </div>
    </header>

    <!-- NAVEGAÇÃO DE TABS -->
    <div style="display:flex; gap:30px; margin-bottom:20px; font-weight:700; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div style="padding-bottom:10px; border-bottom: 2px solid white; cursor:pointer;">Videos</div>
        <div style="padding-bottom:10px; opacity:0.5; cursor:pointer;">Liked</div>
    </div>

    <!-- GRID DE VÍDEOS -->
    <main class="tt-video-grid">
        <!-- Vídeo 1 -->
        <div class="video-card">
            <span class="play-icon">▶ 1.2M</span>
            <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=500" alt="Video">
            <div class="video-footer">☁️ New Update</div>
        </div>
        <!-- Vídeo 2 -->
        <div class="video-card">
            <span class="play-icon">▶ 850K</span>
            <img src="https://images.unsplash.com/photo-1620712943543-bcc4628c9757?w=500" alt="Video">
            <div class="video-footer">🧠 AI Brain</div>
        </div>
        <!-- Vídeo 3 -->
        <div class="video-card">
            <span class="play-icon">▶ 2.5M</span>
            <img src="https://images.unsplash.com/photo-1558494949-ef010cbdcc51?w=500" alt="Video">
            <div class="video-footer">⚡ 2222 Speed</div>
        </div>
        <!-- Vídeo 4 -->
        <div class="video-card">
            <span class="play-icon">▶ 500K</span>
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=500" alt="Video">
            <div class="video-footer">🔐 Security</div>
        </div>
        <!-- Vídeo 5 -->
        <div class="video-card">
            <span class="play-icon">▶ 1.1M</span>
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=500" alt="Video">
            <div class="video-footer">🔋 New Hardware</div>
        </div>
        <!-- Vídeo 6 -->
        <div class="video-card">
            <span class="play-icon">▶ 3.2M</span>
            <img src="https://images.unsplash.com/photo-1531297484001-80022131f5a1?w=500" alt="Video">
            <div class="video-footer">🤖 Meet the Bot</div>
        </div>
    </main>
</div>

</body>
</html>
